name: Socratic
description: >-
  Socratic is an AI-powered homework help and learning app that lets students
  photograph or type a question and receive curated explanations, videos, and
  step-by-step resources across math, science, literature, and social studies.
  Founded in 2013 and backed at the early stage by investors including Andreessen
  Horowitz, Socratic was acquired by Google in 2018 and now operates as "Socratic
  by Google," a free consumer mobile app whose homework-help capabilities have
  largely been folded into Google Lens. Socratic publishes no public API,
  developer portal, SDKs, or documented developer surface; this profile records
  it as an acquired consumer product with no independent API footprint.
